  // 1. ถ้าในเอกสาร users/{uid} มีฟิลด์ `retainRole` ที่ตั้งไว้เฉพาะสำหรับแอปนี้ ให้ใช้ค่านั้นก่อน

  const cleanEmail = String(email || '').toLowerCase().trim();

    return DEFAULT_EMAIL_RETAIN_ROLE_MAP[cleanEmail];

// [ANCHOR: Grounded-Calculations-LPM1013-Rev00-PDF]
// รองรับทั้งการคำนวณแบบเดือน (24M, 4M สำหรับ Fibre) และแบบวัน (7 days สำหรับ Na2SO4, 3 days สำหรับ H2SO4)
// รวมถึงกรณีติด HOLD (ข้อ 7.1: Until case closure plus 12 months, or normal retention if longer)
// =========================================================================
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));

function getCategoryMeta(catCode) {
  return state.f00.find(c => c.retentionCategory === catCode) || DEFAULT_F00_MASTER.find(c => c.retentionCategory === catCode) || DEFAULT_F00_MASTER[1];
}

function calcDisposalDueDate(productionDate, meta, customMonths = 0) {
  if (!productionDate || !meta) return '';
  const parts = String(productionDate).split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return '';
  const [y, m, d] = parts;

  // ถ้ามีข้อตกลงลูกค้าที่เข้มงวดกว่า (ข้อ 2.4 & 7.1.2)
  if (customMonths && Number(customMonths) > 0) {
    const dt = new Date(Date.UTC(y, (m - 1) + Number(customMonths), d));
    return isNaN(dt.getTime()) ? '' : dt.toISOString().slice(0, 10);
  }

  // กรณีระบุอายุเก็บเป็นจำนวนวัน (Na2SO4 = 7 days, H2SO4 = 3 days ตามข้อ 7.1 PDF)
  if (Number(meta.retentionDays || 0) > 0 && Number(meta.retentionMonths || 0) === 0) {
    const dt = new Date(Date.UTC(y, m - 1, d + Number(meta.retentionDays)));
    return isNaN(dt.getTime()) ? '' : dt.toISOString().slice(0, 10);
  }

  // กรณีระบุเป็นจำนวนเดือน (FIBRE-HYG = 24M, FIBRE-STD = 4M)
  const months = Number(meta.retentionMonths || 4);
  const dt = new Date(Date.UTC(y, (m - 1) + months, d));
  return isNaN(dt.getTime()) ? '' : dt.toISOString().slice(0, 10);
}

function calcDaysToDue(disposalDueDate) {
  if (!disposalDueDate) return null;
  const today = new Date(nowISO() + 'T00:00:00Z');
  const due = new Date(disposalDueDate + 'T00:00:00Z');
  return Math.round((due - today) / (1000 * 60 * 60 * 24));
}

function formatDueDateBadge(sample) {
  if (!sample.disposalDueDate) return '-';
  if (sample.status === 'Disposed' || sample.status === 'VOID') {
    return `<span class="text-slate-400">${esc(sample.disposalDueDate)}</span>`;
  }
  const days = sample.daysToDue;
  // สำหรับ Na2SO4 (7 วัน) และ H2SO4 (3 วัน) แจ้งเตือนสีเหลืองเมื่อเหลือ <= 2 วัน; สำหรับ Fibre แจ้งเตือนเมื่อเหลือ <= 30 วัน
  const warnThreshold = (sample.retentionCategory === 'NA2SO4' || sample.retentionCategory === 'H2SO4') ? 2 : 30;
  if (days <= 0) {
    return `<span class="due-overdue" title="ครบกำหนด/เลยกำหนดทำลายแล้ว (${days} วัน)"><i class="fa-solid fa-circle-exclamation mr-1"></i>${esc(sample.disposalDueDate)} (${days}d)</span>`;
  }
  if (days <= warnThreshold) {
    return `<span class="due-warning" title="จะครบกำหนดในอีก ${days} วัน"><i class="fa-solid fa-clock mr-1"></i>${esc(sample.disposalDueDate)} (+${days}d)</span>`;
  }
  return `<span class="due-normal">${esc(sample.disposalDueDate)} <span class="text-[11px] text-slate-400">(${days}d)</span></span>`;
}

function calcWithinLimit(recordType, tempMin, tempMax, rhMax) {
  if (recordType !== 'Daily Temp/RH') return 'N/A';
  if (tempMin === '' || tempMax === '' || rhMax === '' || tempMin === null || tempMax === null || rhMax === null) return '';
  return (Number(tempMin) >= 23 && Number(tempMax) <= 27 && Number(rhMax) <= 65) ? 'Yes' : 'NO - excursion';
}

function enrichF01Sample(raw) {
  const meta = getCategoryMeta(raw.retentionCategory);
  const minQty = Number(meta.minQty || 100);
  const retentionMonths = Number(meta.retentionMonths || 0);
  const retentionDays = Number(meta.retentionDays || 0);
  const retentionDisplay = meta.retentionDisplay || (retentionDays > 0 ? `${retentionDays} days` : `${retentionMonths} months`);
  const disposalDueDate = calcDisposalDueDate(raw.productionDate, meta, raw.customRetentionMonths);
  const withdrawnQty = Number(raw.withdrawnQty || 0);
  const remainingQty = Number(Math.max(0, Number(raw.quantity || 0) - withdrawnQty).toFixed(1));
  const holdFlag = raw.status === 'Disposed' ? 'Closed' : (raw.status === 'VOID' ? 'VOID' : ((!raw.holdRef || !String(raw.holdRef).trim()) ? 'OK' : 'HOLD'));
  const qtyCheck = Number(raw.quantity || 0) >= minQty ? 'OK' : 'LOW';
  const daysToDue = calcDaysToDue(disposalDueDate);
  return {
    ...raw,
    minQty,
    qtyCheck,
    retentionMonths,
    retentionDays,
    retentionDisplay,
    disposalDueDate,
    withdrawnQty,
    remainingQty,
    holdFlag,
    daysToDue
  };
}

// =========================================================================
// [ANCHOR: Auto-Generate-Sample-ID-Fixed-For-Na2SO4-H2SO4-And-Shift-G]
// แก้ไขตามข้อ 4: ให้ทั้ง Fibre, Na2SO4 และ H2SO4 เปลี่ยนรหัสอัตโนมัติตาม วันที่ + กะ (A/B/C/G) + Segment/Lot
// =========================================================================
function buildAutoSampleId({ cat, prodDate, mc, shift, segment }) {
  const yymmdd = String(prodDate || nowISO()).replace(/-/g, '').slice(2);
  const shiftChar = (!shift || shift === 'N/A') ? 'G' : shift.charAt(0);
  const segClean = String(segment || '').trim().replace(/\s+/g, '');

  if (cat === 'NA2SO4') {
    // รูปแบบ Na2SO4 (ข้อ 7.3.1 & 7.4.1): 1 ตัวอย่างต่อรอบผลิต/กะ -> RS-YYMMDD-SS-[Shift/Cycle]
    const cycleSuffix = segClean ? `${shiftChar}-${segClean}` : `${shiftChar}1`;
    return `RS-${yymmdd}-SS-${cycleSuffix}`;
  }
  if (cat === 'H2SO4') {
    // รูปแบบ H2SO4 (ข้อ 7.3.2 & 7.4.1): 1 ตัวอย่างต่อ Delivery Lot / กะรับเข้า -> RS-YYMMDD-SA-[Shift/Lot]
    const lotSuffix = segClean ? `${shiftChar}-${segClean}` : `${shiftChar}1`;
    return `RS-${yymmdd}-SA-${lotSuffix}`;
  }
  // รูปแบบ Fibre (ข้อ 7.4.1): RS-YYMMDD-MCx-S-[segment]
  const mcCode = String(mc || 'MC 3').replace('MC ', 'M').replace('N/A', 'M0');
  return segClean ? `RS-${yymmdd}-${mcCode}-${shiftChar}-${segClean}` : `RS-${yymmdd}-${mcCode}-${shiftChar}`;
}

function toast(msg, type = 'ok') {
  const c = type === 'error' ? 'bg-red-600' : type === 'warn' ? 'bg-amber-500' : 'bg-slate-900';
  const el = document.createElement('div');
  el.className = `toast ${c} text-white px-4 py-3 rounded-xl shadow-xl max-w-sm text-sm font-semibold flex items-center gap-2.5`;
  const icon = type === 'error' ? 'fa-circle-xmark' : type === 'warn' ? 'fa-triangle-exclamation' : 'fa-circle-check';
  el.innerHTML = `<i class="fa-solid ${icon} text-base shrink-0"></i><span>${esc(msg)}</span>`;
  document.getElementById('toastArea').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function loading(on, msg = 'กำลังบันทึก...') {
  let el = document.getElementById('globalLoading');

    if (!el) {
      el = document.createElement('div');
      el.id = 'globalLoading';
      el.className = 'fixed inset-0 z-[140] bg-slate-950/40 flex items-center justify-center';
      el.innerHTML = `<div class="bg-white rounded-2xl p-5 shadow-2xl flex gap-3 items-center"><div class="spinner"></div><span id="loadingText" class="font-bold text-slate-700 text-sm"></span></div>`;

  } else {
    el?.remove();
  }
}

function initDashboardCharts() {
  const tempCanvas = document.getElementById('tempRhChart');
  if (tempCanvas) {
    if (tempChartInstance) tempChartInstance.destroy();
    const dailyLogs = state.f03.filter(r => r.recordType === 'Daily Temp/RH').slice().reverse();
    const labels = dailyLogs.map(r => r.recordRef.replace('TH-', ''));
    tempChartInstance = new Chart(tempCanvas, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Temp Max (°C) [Limit ≤ 27°C]', data: dailyLogs.map(r => r.tempMax), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', tension: 0.3, borderWidth: 2 },
          { label: 'Temp Min (°C) [Limit ≥ 23°C]', data: dailyLogs.map(r => r.tempMin), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', tension: 0.3, borderWidth: 2 },
          { label: 'RH Max (%) [Limit ≤ 65%]', data: dailyLogs.map(r => r.rhMax), borderColor: '#10b981', borderDash: [4, 4], tension: 0.3, borderWidth: 2 }

      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { family: 'Sarabun', size: 11 } } } },
        scales: { y: { beginAtZero: false, suggestedMin: 20, suggestedMax: 70 } }

    });

  const catCanvas = document.getElementById('categoryDonutChart');
  if (catCanvas) {
    if (catChartInstance) catChartInstance.destroy();
    const active = state.f01.filter(s => s.status !== 'Disposed' && s.status !== 'VOID');
    const counts = ['FIBRE-HYG', 'FIBRE-STD', 'NA2SO4', 'H2SO4'].map(cat => active.filter(s => s.retentionCategory === cat).length);
    catChartInstance = new Chart(catCanvas, {
      type: 'doughnut',

        maintainAspectRatio: false,
        cutout: '68%',
        plugins: { legend: { position: 'right', labels: { font: { family: 'Sarabun', size: 11 } } } }

const F01_VIEWS = [
  ['Active Retains', 'Active Retains (กำลังเก็บ)'],
  ['KENVUE Hygiene', 'KENVUE Hygiene (24M)'],
  ['Due in 30 Days', 'ใกล้ครบกำหนด (Due ≤ 30d)'],
  ['Ready for Disposal', 'Ready for Disposal (พร้อมส่ง F04)'],
  ['HOLD', 'HOLD (ห้ามทำลาย)'],
  ['Qty LOW', 'Qty LOW (ต่ำกว่าเกณฑ์)'],
  ['All Items', 'All Items (ทั้งหมด)']
];

function getFilteredF01() {
  return state.f01.filter(s => {
    if (state.f01View === 'Active Retains' && (s.status === 'Disposed' || s.status === 'VOID')) return false;
    if (state.f01View === 'KENVUE Hygiene' && (s.retentionCategory !== 'FIBRE-HYG' || s.status === 'Disposed' || s.status === 'VOID')) return false;
    if (state.f01View === 'Due in 30 Days') {
      if (s.status === 'Disposed' || s.status === 'VOID' || s.holdFlag !== 'OK') return false;
      if (s.daysToDue === null || s.daysToDue <= 0 || s.daysToDue > 30) return false;
    }
    if (state.f01View === 'Ready for Disposal') {
      if (s.status === 'Disposed' || s.status === 'VOID' || s.holdFlag !== 'OK') return false;
      if (s.daysToDue === null || s.daysToDue > 0) return false;
    }
    if (state.f01View === 'HOLD' && s.holdFlag !== 'HOLD') return false;
    if (state.f01View === 'Qty LOW' && s.qtyCheck !== 'LOW') return false;

    if (state.filterMc !== 'All' && s.mc !== state.filterMc) return false;
    if (state.filterCategory !== 'All' && s.retentionCategory !== state.filterCategory) return false;

    if (state.searchQuery.trim() !== '') {
      const q = state.searchQuery.toLowerCase();
      if (!`${s.sampleId} ${s.product} ${s.customer} ${s.retentionCategory} ${s.mc} ${s.storageLocation} ${s.holdRef} ${s.sapLot || ''} ${s.coaRef || ''}`.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

            <select name="conditionResult" class="w-full border border-slate-300 rounded-lg p-2 mt-1 bg-white">
              ${CONDITION_RESULTS.map(r => `<option value="${r}" ${s.conditionResult === r ? 'selected' : ''}>${r || '-- ยังไม่ตรวจ --'}</option>`).join('')}

            <select name="status" class="w-full border border-slate-300 rounded-lg p-2 mt-1 bg-white">

      ${existing ? `
      <label class="block text-xs font-bold text-amber-900 bg-amber-50 p-2.5 rounded-xl border border-amber-200">
        เหตุผลที่แก้ไขข้อมูล (ALCOA+): <input type="text" name="changeReason" required placeholder="ระบุเหตุผลที่แก้ไข..." class="w-full border border-amber-300 rounded-lg p-2 mt-1 bg-white font-normal">
      </label>` : ''}

      <div class="flex justify-between items-center pt-2 border-t">
        <div>
          ${existing ? `<button type="button" onclick="tryDeleteF01Sample('${esc(s.sampleId)}')" class="text-xs font-bold text-red-600 hover:underline">ยกเลิกรายการ (VOID)</button>` : ''}
        </div>
        <div class="flex gap-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border text-xs font-bold text-slate-600">ยกเลิก</button>

          </button>
        </div>
      </div>
    </form>
  `);

  window.pickF01Cat = cat => {
    document.getElementById('qCat').value = cat;
    document.querySelectorAll('.cat-pick-btn').forEach(b => {
      b.className = `cat-pick-btn p-2.5 rounded-xl border text-left transition ${b.dataset.cat === cat ? 'btn-pick-active shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`;
    });
    const meta = getCategoryMeta(cat);
    document.getElementById('qUnitLabel').textContent = meta.unit;
    if (!existing) {
      document.getElementById('qQty').value = meta.minQty;
      document.getElementById('qLoc').value = meta.defaultLocation;
      if (cat === 'NA2SO4' || cat === 'H2SO4') {
        pickF01Mc('N/A');
      } else if (document.getElementById('qMc').value === 'N/A') {
        pickF01Mc('MC 3');
      }
    }
    syncQuickPreview();
  };

  window.pickF01Mc = mc => {
    document.getElementById('qMc').value = mc;
    document.querySelectorAll('.mc-pick-btn').forEach(b => {
      b.className = `mc-pick-btn px-3 py-1.5 rounded-lg border text-xs font-bold transition ${b.dataset.mc === mc ? 'btn-pick-active' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`;
    });
    syncQuickPreview();
  };

  window.pickF01Shift = sh => {
    document.getElementById('qShift').value = sh;
    document.querySelectorAll('.shift-pick-btn').forEach(b => {
      b.className = `shift-pick-btn px-3 py-1.5 rounded-lg border text-xs font-bold transition ${b.dataset.shift === sh ? 'btn-pick-active' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`;
    });
    syncQuickPreview();
  };

  window.syncQuickPreview = () => {
    const cat = document.getElementById('qCat').value;
    const mc = document.getElementById('qMc').value;
    const sh = document.getElementById('qShift').value;
    const prodDate = document.getElementById('qProdDate').value || nowISO();
    const qty = Number(document.getElementById('qQty').value || 0);
    const segment = document.getElementById('qSegment').value || '';
    const meta = getCategoryMeta(cat);
    const dueDate = calcDisposalDueDate(prodDate, meta);
    const qtyOk = qty >= meta.minQty && (!meta.maxQty || qty <= meta.maxQty);

    if (!existing) {
      document.getElementById('qSampleId').value = buildAutoSampleId({ cat, prodDate, mc, shift: sh, segment });
    }

    const reqText = meta.maxQty ? `${meta.minQty}–${meta.maxQty} ${meta.unit}` : `≥ ${meta.minQty} ${meta.unit}`;
    document.getElementById('qAutoSummary').innerHTML = `
      <span><b>สินค้า:</b> ${esc(meta.defaultProduct)}</span>
      <span><b>เกณฑ์ปริมาณ:</b> ${reqText} (<b class="${qtyOk ? 'text-emerald-700' : 'text-red-600'}">${qtyOk ? 'OK' : 'LOW/OUT'}</b>)</span>
      <span><b>ครบกำหนดทำลาย (${esc(meta.retentionDisplay)}):</b> <b>${dueDate}</b></span>
    `;
  };

  syncQuickPreview();

  document.getElementById('f01QuickForm').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    const sampleId = String(data.sampleId || '').trim().toUpperCase();
    const meta = getCategoryMeta(data.retentionCategory);

    if (!sampleId.startsWith('RS-')) return toast('Sample ID ต้องขึ้นต้นด้วย RS-', 'error');
    if (!existing && state.f01.some(x => x.sampleId.toUpperCase() === sampleId)) return toast(`Sample ID "${sampleId}" ซ้ำในระบบ`, 'error');
    if (data.holdRef && data.holdRef.trim() !== '' && data.status === 'Disposed') return toast('ห้ามเปลี่ยนเป็น Disposed ขณะมี Hold Ref (ข้อ 7.9.3)', 'error');

    const enriched = enrichF01Sample({
      ...(existing || {}),
      sampleId,
      product: meta.defaultProduct,
      customer: data.customer || '',
      retentionCategory: data.retentionCategory,
      mc: data.mc,
      shift: data.shift,
      timeRange: data.timeRange || '',
      sapLot: data.sapLot || '',
      coaRef: data.sapLot || '',
      missingHours: data.missingHours || '',
      productionDate: data.productionDate,
      samplingDate: existing ? existing.samplingDate : nowISO(),
      sampledBy: existing ? existing.sampledBy : state.user.email,
      quantity: Number(data.quantity),
      unit: meta.unit,
      packaging: existing ? existing.packaging : meta.defaultPackaging,
      storageLocation: data.storageLocation || meta.defaultLocation,
      withdrawnQty: existing ? Number(existing.withdrawnQty || 0) : 0,
      holdRef: (data.holdRef || '').trim(),
      holdOwner: data.holdOwner || '',
      status: (data.holdRef || '').trim() ? (data.status === 'Retained' ? 'On Hold' : data.status) : data.status,
      conditionCheckDate: data.conditionCheckDate || '',
      conditionResult: data.conditionResult || '',
      checkedBy: data.conditionResult ? state.user.email : '',
      remarks: data.remarks || '',
      lastChangeReason: existing ? data.changeReason : 'Initial registration F01',
      updatedBy: state.user.email,
      updatedAt: SV.serverTimestamp()
    });
    if (!existing) enriched.createdAt = SV.serverTimestamp();

    loading(true, 'กำลังบันทึก...');
    try {
      await db.collection('retain_samples_f01').doc(sampleId).set(enriched, { merge: true });
      await logAuditTrail(existing ? 'UPDATE_F01' : 'CREATE_F01', 'F01', sampleId, enriched.lastChangeReason);
      closeModal();
      toast(`บันทึก ${sampleId} เรียบร้อยแล้ว`);
    } catch (err) {
      toast(`บันทึกไม่สำเร็จ: ${err.message}`, 'error');
    } finally {
      loading(false);
    }
  };
}

window.tryDeleteF01Sample = async function(sampleId) {
  if (state.f02.some(w => w.sampleId === sampleId && w.status !== 'VOID') || state.f04.some(d => d.sampleId === sampleId && d.status !== 'VOID')) {
    return toast('ลบ/ยกเลิกไม่ได้ เนื่องจากมีประวัติเบิกหรือทำลายแล้ว', 'error');
  }
  const res = await confirmActionModal({ title: `ยกเลิกรายการ ${sampleId} (VOID)`, message: 'ระบบจะเก็บประวัติไว้ตามมาตรฐาน GMP และไม่แสดงในรายการใช้งาน', requireReason: true });
  if (!res) return;
  loading(true, 'กำลังยกเลิกรายการ...');
  try {
    await db.collection('retain_samples_f01').doc(sampleId).update({ status: 'VOID', holdFlag: 'VOID', lastChangeReason: res.reason, updatedBy: state.user.email, updatedAt: SV.serverTimestamp() });
    await logAuditTrail('VOID_F01', 'F01', sampleId, res.reason);
    closeModal();
    toast(`ยกเลิกรายการ ${sampleId} เรียบร้อย`);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    loading(false);
  }
};

function openF02Modal(editNo = '', preselectSampleId = '') {
  const existing = editNo ? state.f02.find(w => w.withdrawalNo === editNo) : null;
  const activeSamples = state.f01.filter(s => s.status !== 'Disposed' && s.status !== 'VOID');
  if (!existing && activeSamples.length === 0) return toast('กรุณาเพิ่มตัวอย่างใน F01 ก่อน', 'warn');

  const yymm = nowISO().replace(/-/g, '').slice(2, 6);
  const w = existing || {
    withdrawalNo: `WD-${yymm}-${String(state.f02.length + 1).padStart(3, '0')}`,
    sampleId: preselectSampleId || activeSamples[0].sampleId,
    withdrawalDate: nowISO(),
    purpose: 'Customer complaint',
    qtyWithdrawn: 20,
    unit: 'g',
    referenceNo: '',
    destination: 'In-house Lab',
    dispatchRef: '',
    withdrawnBy: state.user?.email || '',
    approvalStatus: 'Pending',
    returnedToStore: 'No',
    remarks: ''
  };

  const preSample = state.f01.find(s => s.sampleId === w.sampleId) || activeSamples[0];
  const initCat = preselectSampleId || existing ? (preSample?.retentionCategory || 'ALL') : 'ALL';
  const initMc = preselectSampleId || existing ? (preSample?.mc || 'ALL') : 'ALL';
  const initShift = preselectSampleId || existing ? (preSample?.shift || 'ALL') : 'ALL';
  const initDate = preselectSampleId ? (preSample?.productionDate || '') : '';

  showModal(`
    <form id="f02Form" class="p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">

  const f02Filter = { cat: initCat, mc: initMc, shift: initShift };

  window.setF02Filter = (type, val) => {
    f02Filter[type] = val;
    refreshF02SampleOptions();
  };

  window.resetF02Finder = () => {
    f02Filter.cat = 'ALL';
    f02Filter.mc = 'ALL';
    f02Filter.shift = 'ALL';
    document.getElementById('f02FilterDate').value = '';
    refreshF02SampleOptions();
  };

  window.refreshF02SampleOptions = () => {
    document.querySelectorAll('.f02-cat-btn').forEach(b => {
      b.className = `f02-cat-btn px-2.5 py-1 rounded-lg border font-bold transition ${b.dataset.f02cat === f02Filter.cat ? 'btn-pick-active' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}`;
    });
    document.querySelectorAll('.f02-mc-btn').forEach(b => {
      b.className = `f02-mc-btn px-2.5 py-1 rounded-lg border font-bold transition ${b.dataset.f02mc === f02Filter.mc ? 'btn-pick-active' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}`;
    });
    document.querySelectorAll('.f02-shift-btn').forEach(b => {
      b.className = `f02-shift-btn px-2.5 py-1 rounded-lg border font-bold transition ${b.dataset.f02shift === f02Filter.shift ? 'btn-pick-active' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}`;
    });

    const fDate = document.getElementById('f02FilterDate').value;
    const matched = activeSamples.filter(s => {
      if (f02Filter.cat !== 'ALL' && s.retentionCategory !== f02Filter.cat) return false;
      if (f02Filter.mc !== 'ALL' && s.mc !== f02Filter.mc) return false;
      if (f02Filter.shift !== 'ALL' && s.shift !== f02Filter.shift) return false;
      if (fDate && s.productionDate !== fDate) return false;
      return true;
    });

    document.getElementById('f02MatchCount').textContent = matched.length;
    const sel = document.getElementById('f02SampleSelect');
    if (matched.length === 0) {
      sel.innerHTML = `<option value="">-- ไม่พบ Sample ID ที่ตรงกับเงื่อนไข (ลองกด "ล้างตัวกรอง") --</option>`;
    } else {
      sel.innerHTML = matched.map(s => `<option value="${esc(s.sampleId)}" ${s.sampleId === w.sampleId ? 'selected' : ''}>${esc(s.sampleId)} — คงเหลือ ${s.remainingQty}${esc(s.unit)} (${esc(s.storageLocation)})</option>`).join('');
    }
    onF02SamplePicked();
  };

  window.onF02SamplePicked = () => {
    const sid = document.getElementById('f02SampleSelect')?.value;
    const s = state.f01.find(x => x.sampleId === sid);
    const bar = document.getElementById('f02SampleDetailBar');
    if (!s || !bar) {
      if (bar) bar.innerHTML = `<span class="text-amber-700 font-bold">กรุณาเลือกประเภท/วันที่/กะที่มีตัวอย่างในระบบ</span>`;
      return;
    }
    document.getElementById('f02UnitText').textContent = s.unit;
    bar.innerHTML = `
      <span><b>สินค้า:</b> ${esc(s.product)} (${esc(s.retentionCategory)})</span>
      <span><b>MC/กะ:</b> ${esc(s.mc)} / ${esc((s.shift || '').split(' ')[0])}</span>
      <span><b>วันผลิต:</b> ${esc(s.productionDate)}</span>
      <span><b>ที่เก็บ:</b> ${esc(s.storageLocation)}</span>
      <span class="text-emerald-700 font-extrabold">คงเหลือพร้อมเบิก: ${s.remainingQty} ${esc(s.unit)}</span>
    `;
  };

  refreshF02SampleOptions();

  document.getElementById('f02Form').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    const parent = state.f01.find(s => s.sampleId === data.sampleId);
    if (!parent) return toast('กรุณาเลือก Sample ID', 'error');

    const reqQty = Number(data.qtyWithdrawn);
    const avail = existing && existing.approvalStatus === 'Approved' ? parent.remainingQty + Number(existing.qtyWithdrawn) : parent.remainingQty;
    if (reqQty > avail) return toast(`ปริมาณขอเบิก (${reqQty}) เกินยอดคงเหลือ (${avail} ${parent.unit})`, 'error');

    const record = {
      ...(existing || {}),
      withdrawalNo: w.withdrawalNo,
      sampleId: data.sampleId,
      withdrawalDate: data.withdrawalDate,
      purpose: data.purpose,
      qtyWithdrawn: reqQty,
      unit: parent.unit,
      referenceNo: data.referenceNo || '',
      destination: data.destination || 'In-house Lab',
      dispatchRef: data.dispatchRef || '',
      withdrawnBy: existing ? existing.withdrawnBy : state.user.email,
      approvedBy: w.approvedBy || '',
      approvalStatus: w.approvalStatus || 'Pending',
      returnedToStore: data.returnedToStore,
      updatedBy: state.user.email,
      updatedAt: SV.serverTimestamp()
    };
    if (!existing) record.createdAt = SV.serverTimestamp();

    loading(true, 'กำลังบันทึกใบเบิก...');
    try {
      await db.collection('retain_withdrawals_f02').doc(record.withdrawalNo).set(record, { merge: true });
      await logAuditTrail(existing ? 'UPDATE_F02' : 'CREATE_F02', 'F02', record.withdrawalNo, `${record.sampleId} (${record.qtyWithdrawn}${record.unit})`);
      closeModal();
      toast(`บันทึกใบเบิก ${record.withdrawalNo} เรียบร้อย`);
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      loading(false);
    }
  };
}

  window.approveOrRejectF02 = async function(withdrawalNo, newStatus) {
  if (!canCurrentUserApproveF02()) {
    return toast('คุณไม่มีสิทธิ์อนุมัติ/ปฏิเสธใบเบิก F02 (เฉพาะผู้มีสิทธิ์ที่กำหนด)', 'error');
  }
  const w = state.f02.find(x => x.withdrawalNo === withdrawalNo);
  if (!w) return;
  const res = await confirmActionModal({
    title: `${newStatus === 'Approved' ? 'อนุมัติ' : 'ปฏิเสธ'}ใบเบิก ${withdrawalNo}`,
    message: `ตัวอย่าง: ${w.sampleId} จำนวน ${w.qtyWithdrawn} ${w.unit}`,
    requireReason: newStatus === 'Rejected'
  });
  if (!res) return;
  loading(true, 'กำลังบันทึกผล...');
  try {
    await db.collection('retain_withdrawals_f02').doc(withdrawalNo).update({
      approvalStatus: newStatus,
      approvedBy: `${state.user.email} (${state.retainRole})`,
      updatedBy: state.user.email,
      updatedAt: SV.serverTimestamp()
    });
    await logAuditTrail(`F02_${newStatus.toUpperCase()}`, 'F02', withdrawalNo, res.reason);
    toast(`อัปเดต ${withdrawalNo} เป็น ${newStatus} แล้ว`);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    loading(false);
  }
};

          storeLocation: F03_STORE_LOCATIONS[0].label,
          recordDate: nowISO(),
          session: 'AM',
          recordDateTime: `${nowISO()}T09:00`,
          tempMin: 24.0,
          tempMax: 25.5,
          rhMin: 50,
          rhMax: 58,
          excursionAction: '',

          inspectionRemarks: '',
          recordedBy: state.user?.email || '',
          reviewedBy: ''
        };
        const initDate = existing && existing.recordDateTime ? existing.recordDateTime.slice(0, 10) : nowISO();
        const initSession = existing && existing.recordRef?.endsWith('-PM') ? 'PM' : 'AM';
        const initStoreCode = String(r.storeLocation || '').includes('Chemical') ? 'CHEM' : 'TEX';
        showModal(`
          <form id="f03Form" class="p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">

        };
        window.setF03Type = rt => {
          document.getElementById('f03Type').value = rt;
          syncF03AutoRef();
        };
        window.setF03Session = ss => {
          document.getElementById('f03Session').value = ss;
          syncF03AutoRef();
        };
        window.syncF03AutoRef = () => {
          const rt = document.getElementById('f03Type').value;
          const isDaily = rt === 'Daily Temp/RH';
          const dStr = document.getElementById('f03Date').value || nowISO();
          const ss = document.getElementById('f03Session').value || 'AM';
          const storeCode = document.getElementById('f03StoreCode').value || 'TEX';
          document.getElementById('f03BtnDaily').className = `flex-1 py-2 px-2 rounded-xl border font-bold transition ${isDaily ? 'btn-pick-active' : 'bg-white text-slate-600 border-slate-200'}`;
          document.getElementById('f03BtnMonthly').className = `flex-1 py-2 px-2 rounded-xl border font-bold transition ${!isDaily ? 'btn-pick-active' : 'bg-white text-slate-600 border-slate-200'}`;
          document.querySelectorAll('.f03-ss-btn').forEach(b => {
            b.className = `f03-ss-btn flex-1 py-2 rounded-xl border font-bold transition ${b.dataset.f03ss === ss ? 'btn-pick-active' : 'bg-white text-slate-600 border-slate-200'}`;
          });
          document.getElementById('f03SessionWrap').classList.toggle('opacity-40', !isDaily);
          document.getElementById('f03DailyZone').classList.toggle('hidden', !isDaily);
          document.getElementById('f03MonthlyZone').classList.toggle('hidden', isDaily);
          if (!existing) {
            const yymmdd = dStr.replace(/-/g, '').slice(2);
            const yymm = yymmdd.slice(0, 4);
            document.getElementById('f03Ref').value = isDaily ? `TH-${yymmdd}-${storeCode}-${ss}` : `INSP-${yymm}-${storeCode}`;
            document.getElementById('f03DateTime').value = `${dStr}T${ss === 'PM' ? '14:00' : '09:00'}`;
          }
        };
        syncF03AutoRef();
        document.getElementById('f03Form').onsubmit = async e => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const data = Object.fromEntries(fd.entries());
          const isDaily = data.recordType === 'Daily Temp/RH';
          if (isDaily && (Number(data.tempMax) < Number(data.tempMin) || Number(data.rhMax) < Number(data.rhMin))) {
            return toast('Temp Max ต้อง ≥ Temp Min และ RH Max ต้อง ≥ RH Min', 'error');
          }
          const withinLimit = calcWithinLimit(data.recordType, data.tempMin, data.tempMax, data.rhMax);
          const record = {
            recordRef: data.recordRef,
            recordType: data.recordType,
            storeLocation: data.storeLocation || F03_STORE_LOCATIONS[0].label,
            recordDateTime: data.recordDateTime,
      tempMin: isDaily ? Number(data.tempMin) : null,
      tempMax: isDaily ? Number(data.tempMax) : null,
      rhMin: isDaily ? Number(data.rhMin) : null,
      rhMax: isDaily ? Number(data.rhMax) : null,
      withinLimit,
      excursionAction: isDaily ? (data.excursionAction || '') : '',
      inspectionRemarks: !isDaily ? (data.inspectionRemarks || '') : '',
      recordedBy: existing ? existing.recordedBy : state.user.email,
      reviewedBy: existing ? existing.reviewedBy : '',
      updatedAt: SV.serverTimestamp()
    };
    if (!existing) record.createdAt = SV.serverTimestamp();
    F03_INSPECTION_ITEMS.forEach(([code]) => { record[code] = !isDaily ? data[code] : ''; });

    loading(true, 'กำลังบันทึก...');
    try {
      await db.collection('retain_monitoring_f03').doc(record.recordRef).set(record, { merge: true });
      await logAuditTrail(existing ? 'UPDATE_F03' : 'CREATE_F03', 'F03', record.recordRef, `${record.recordType} (${withinLimit})`);
      closeModal();
      toast(withinLimit === 'NO - excursion' ? 'บันทึกแล้ว — แจ้งเตือน: ค่าเกินเกณฑ์ควบคุม 25±2°C / RH 65%!' : 'บันทึก F03 เรียบร้อย', withinLimit === 'NO - excursion' ? 'warn' : 'ok');
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      loading(false);
    }
  };
}

window.reviewF03Record = async function(ref) {
  const res = await confirmActionModal({ title: `ทบทวนบันทึก ${ref}`, message: 'ยืนยันการลงนามทบทวนบันทึกห้องเก็บตัวอย่าง' });
  if (!res) return;
  loading(true, 'กำลังบันทึก...');
  try {
    await db.collection('retain_monitoring_f03').doc(ref).update({ reviewedBy: `${state.user.email} (${state.retainRole})`, updatedAt: SV.serverTimestamp() });
    await logAuditTrail('REVIEW_F03', 'F03', ref, 'Reviewed');
    toast('ลงนามทบทวนเรียบร้อย');
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    loading(false);
  }
};

window.sendReadySamplesToF04 = async function() {
  const ready = state.f01.filter(s => s.status !== 'Disposed' && s.status !== 'VOID' && s.holdFlag === 'OK' && s.daysToDue !== null && s.daysToDue <= 0);
  if (!ready.length) return toast('ไม่มีรายการถึงกำหนดทำลาย', 'warn');
  const listNo = `DL-${nowISO().replace(/-/g, '').slice(2, 6)}`;
  loading(true, 'กำลังส่งรายการเข้า F04...');
  try {
    const batch = db.batch();
    let count = 0;
    ready.forEach(s => {
      if (!state.f04.some(d => d.sampleId === s.sampleId)) {
        batch.set(db.collection('retain_disposals_f04').doc(`${listNo}-${s.sampleId}`), {
          disposalListNo: listNo, sampleId: s.sampleId, holdCheck: 'No hold - confirmed', qaApproved: 'Pending',
          qaApprover: '', qaApprovalDate: '', actualDisposalDate: '', disposalMethod: s.retentionCategory === 'H2SO4' ? 'Neutralization + WWT (LPM-1012 / EHS)' : 'Industrial waste (LPM-1012)',
          disposedBy: '', witnessedBy: '', f01StatusUpdated: 'No', createdBy: state.user.email, createdAt: SV.serverTimestamp(), updatedAt: SV.serverTimestamp()
        });
        count++;
      }
    });
    if (count > 0) await batch.commit();
    state.view = 'f04'; buildNav(); render();
    toast(`ส่ง ${count} รายการเข้าใบขอทำลาย ${listNo} เรียบร้อย`);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    loading(false);
  }
};

  window.checkF04EarlyDisposalBanner = () => {
    const sid = document.getElementById('f04SampleSelect')?.value;
    const parent = state.f01.find(s => s.sampleId === sid);
    const actualDt = document.getElementById('f04ActualDate')?.value;
    const banner = document.getElementById('f04EarlyBanner');
    const dueSpan = document.getElementById('f04DueText');
    const reasonInp = document.getElementById('f04EarlyReasonInput');
    const checkDate = actualDt || nowISO();
    if (parent && parent.disposalDueDate && checkDate < parent.disposalDueDate) {
      banner?.classList.remove('hidden');
      if (dueSpan) dueSpan.textContent = parent.disposalDueDate;
      if (reasonInp && actualDt) reasonInp.required = true;
    } else {
      banner?.classList.add('hidden');
      if (reasonInp) reasonInp.required = false;
    }
  };
  window.refreshF04SampleOptions = () => {
    const onlyDue = document.getElementById('f04OnlyDueChk')?.checked;
    const fCat = document.getElementById('f04FilterCat')?.value || 'ALL';
    const fMc = document.getElementById('f04FilterMc')?.value || 'ALL';
    const fDate = document.getElementById('f04FilterDate')?.value || '';
    const matched = candidateSamples.filter(s => {
      if (existing && s.sampleId === existing.sampleId) return true;
      if (onlyDue && (s.daysToDue === null || s.daysToDue > 0)) return false;
      if (fCat !== 'ALL' && s.retentionCategory !== fCat) return false;
      if (fMc !== 'ALL' && s.mc !== fMc) return false;
      if (fDate && s.productionDate !== fDate) return false;
      return true;
    });
    document.getElementById('f04MatchCount').textContent = matched.length;
    const sel = document.getElementById('f04SampleSelect');
    if (matched.length === 0) {
      sel.innerHTML = `<option value="">-- ไม่พบตัวอย่างที่ตรงเงื่อนไข --</option>`;
    } else {
      sel.innerHTML = matched.map(s => `<option value="${esc(s.sampleId)}" ${s.sampleId === d.sampleId ? 'selected' : ''}>${esc(s.sampleId)} (${esc(s.retentionCategory)} • Due: ${esc(s.disposalDueDate)})</option>`).join('');
    }
    sel.onchange = checkF04EarlyDisposalBanner;
    checkF04EarlyDisposalBanner();
  };
  refreshF04SampleOptions();
  document.getElementById('f04Form').onsubmit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    if (!data.sampleId) return toast('กรุณาเลือก Sample ID', 'error');
    const parent = state.f01.find(s => s.sampleId === data.sampleId);
    const isEarly = Boolean(parent && parent.disposalDueDate && ((data.actualDisposalDate && data.actualDisposalDate < parent.disposalDueDate) || (!data.actualDisposalDate && nowISO() < parent.disposalDueDate)));
    if (data.actualDisposalDate) {
      if (data.qaApproved !== 'Yes' || !data.qaApprovalDate || data.actualDisposalDate < data.qaApprovalDate) return toast('ต้องได้รับการอนุมัติ QA Approved = Yes ก่อนจึงจะบันทึกวันทำลายจริงได้', 'error');
      if (!data.disposedBy.trim() || !data.witnessedBy.trim() || data.disposedBy.trim().toLowerCase() === data.witnessedBy.trim().toLowerCase()) return toast('ต้องระบุผู้ทำลายและพยานที่เป็นคนละคนกัน (ข้อ 7.10.5)', 'error');
      if (parent && parent.retentionCategory === 'FIBRE-HYG' && data.actualDisposalDate < parent.disposalDueDate) return toast(`ห้ามทำลายตัวอย่าง KENVUE ก่อน ${parent.disposalDueDate} (ข้อ 7.10.3)`, 'error');
      if (isEarly && !String(data.earlyDisposalReason || '').trim()) {
        return toast('กรุณาระบุเหตุผลการทำลายก่อนวันครบกำหนด (Early Disposal Reason)', 'error');
      }
    }
    const docId = existing ? existing.id : `${data.disposalListNo}-${data.sampleId}`;
    loading(true, 'กำลังบันทึก...');
    try {
      await db.collection('retain_disposals_f04').doc(docId).set({
        ...data,
        holdCheck: 'No hold - confirmed',
        qaApprover: data.qaApproved === 'Yes' ? (d.qaApprover || `${state.user.email} (${state.retainRole})`) : '',
        f01StatusUpdated: d.f01StatusUpdated || 'No',
        updatedBy: state.user.email,
        updatedAt: SV.serverTimestamp(),
        ...(existing ? {} : { createdAt: SV.serverTimestamp() })
      }, { merge: true });
      const auditNote = isEarly && data.earlyDisposalReason ? `Sample ${data.sampleId} (Early Reason: ${data.earlyDisposalReason})` : `Sample ${data.sampleId}`;
      await logAuditTrail('SAVE_F04', 'F04', docId, auditNote);
      closeModal();
      toast('บันทึก F04 เรียบร้อย');
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      loading(false);
    }
  };
}

window.qaApproveF04 = async function(id) {
  const d = state.f04.find(x => x.id === id);
  if (!d) return;
  const parent = state.f01.find(s => s.sampleId === d.sampleId);
  if (parent && parent.holdFlag === 'HOLD') return toast('ตัวอย่างติด HOLD ห้ามอนุมัติทำลาย', 'error');
  const res = await confirmActionModal({ title: `QA อนุมัติทำลาย ${d.sampleId}`, message: 'ยืนยันการอนุมัติทำลายตัวอย่างตาม LPM-1013 ข้อ 7.10.3' });
  if (!res) return;
  loading(true, 'กำลังอนุมัติ...');
  try {
    await db.collection('retain_disposals_f04').doc(id).update({ qaApproved: 'Yes', qaApprover: `${state.user.email} (${state.retainRole})`, qaApprovalDate: nowISO(), updatedAt: SV.serverTimestamp() });
    await logAuditTrail('QA_APPROVE_F04', 'F04', id, `Approved ${d.sampleId}`);
    toast('อนุมัติทำลายเรียบร้อย');
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    loading(false);
  }
};

function getLast7Days(endDateStr) {
  const days = [];
  const base = new Date((endDateStr || nowISO()) + 'T00:00:00Z');
  for (let i = 6; i >= 0; i--) {
    const d = new Date(base.getTime() - i * 86400000);
    days.push(d.toISOString().slice(0, 10));
  }
  return days;
}

  function formatStabilitySummaryChip(s) {
    const params = Array.isArray(s.stabilityTests) ? s.stabilityTests : [];
    const filled = params.filter(p => p && (p.orig || p.m6 || p.m12 || p.m18 || p.m24));
    if (filled.length === 0) {
      return `<span class="text-[11px] text-slate-400">ยังไม่ระบุผลทดสอบ</span>`;
    }
    return `
      <div class="flex flex-wrap gap-1">
        ${filled.map(p => {
          const stages = [];
          if (p.orig !== undefined && p.orig !== '') stages.push(`0M:<b>${esc(p.orig)}</b>`);
          if (p.m6 !== undefined && p.m6 !== '') stages.push(`6M:<b class="text-blue-700">${esc(p.m6)}</b>`);
          if (p.m12 !== undefined && p.m12 !== '') stages.push(`12M:<b class="text-indigo-700">${esc(p.m12)}</b>`);
          if (p.m18 !== undefined && p.m18 !== '') stages.push(`18M:<b class="text-purple-700">${esc(p.m18)}</b>`);
          if (p.m24 !== undefined && p.m24 !== '') stages.push(`24M:<b class="text-emerald-700">${esc(p.m24)}</b>`);
          return `<span class="px-2 py-0.5 rounded-md bg-slate-100 border border-slate-200 text-[10px] text-slate-700"><span class="font-bold">${esc(p.name)}:</span> ${stages.join(' → ')}</span>`;
        }).join('')}
      </div>
    `;
  }

  window.exportAuditTrailByDateRange = async function() {
    const startStr = document.getElementById('auditStartInput')?.value || state.auditExportStart;
    const endStr = document.getElementById('auditEndInput')?.value || state.auditExportEnd;
    if (!startStr || !endStr) return toast('กรุณาเลือกช่วงวันที่เริ่มต้นและสิ้นสุด', 'warn');
    if (startStr > endStr) return toast('วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด', 'error');

    const startDate = new Date(startStr + 'T00:00:00+07:00');
    const endDate = new Date(endStr + 'T23:59:59.999+07:00');

    loading(true, `กำลังดึงประวัติ ALCOA+ ช่วง ${startStr} ถึง ${endStr}...`);
    try {
      const snap = await db.collection('retain_audit_events')
        .where('createdAt', '>=', firebase.firestore.Timestamp.fromDate(startDate))
        .where('createdAt', '<=', firebase.firestore.Timestamp.fromDate(endDate))
        .orderBy('createdAt', 'desc')
        .get();

      if (snap.empty) {
        toast(`ไม่พบประวัติการทำรายการในช่วง ${startStr} ถึง ${endStr}`, 'warn');
        return;
      }

      const csvRows = [
        ['Timestamp (TH)', 'User Email', 'Retain Role', 'Action', 'Entity Type', 'Record ID', 'Reason / Details', 'Changed Fields']
      ];
      snap.docs.forEach(doc => {
        const ev = doc.data();
        const dtStr = ev.createdAt?.toDate ? ev.createdAt.toDate().toLocaleString('th-TH') : '-';
        const changed = Array.isArray(ev.changedFields) ? ev.changedFields.join('; ') : '';
        csvRows.push([
          dtStr,
          ev.user || '',
          ev.role || '',
          ev.action || '',
          ev.entityType || '',
          ev.recordId || '',
          ev.reason || '',
          changed
        ]);
      });

      const blob = new Blob(
        ['\uFEFF' + csvRows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n')],
        { type: 'text/csv;charset=utf-8;' }
      );
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `LPM1013_ALCOA_AuditTrail_${startStr}_to_${endStr}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast(`Export ประวัติ ALCOA+ จำนวน ${snap.size} รายการ เรียบร้อยแล้ว`);
    } catch (err) {
      toast(`ดึงข้อมูลไม่สำเร็จ: ${err.message}`, 'error');
    } finally {
      loading(false);
    }
  };

window.saveUserRetainRole = async function(uid, email) {
  const newRetainRole = document.getElementById(`rrole-${uid}`)?.value;
  if (!newRetainRole) return;
  loading(true, 'กำลังบันทึกสิทธิ์ Retain Role...');
  try {
    await db.collection('users').doc(uid).set({
      retainRole: newRetainRole,
      retainRoleUpdatedAt: SV.serverTimestamp(),
      retainRoleUpdatedBy: state.user.email
    }, { merge: true });
    if (uid === state.user.uid) {
      state.retainRole = newRetainRole;
      document.getElementById('userRole').textContent = newRetainRole;
    }
    toast(`อัปเดตสิทธิ์ Retain Sample ของ ${email} เป็น "${newRetainRole}" เรียบร้อย (ไม่กระทบสิทธิ์ Audit)`);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    loading(false);
  }
};

  window.exportCurrentViewCSV = function() {
    const rows = [['Sample ID', 'Product', 'Customer', 'Category', 'MC', 'Shift', 'Segment', 'SAP Lot/CoA', 'Production Date', 'Qty', 'Unit', 'Withdrawn', 'Remaining', 'Disposal Due Date', 'Hold Ref', 'Status', 'Storage Location', 'Condition Check Date', 'Condition Result', 'Stability Test Results (0M-24M)']];
    state.f01.forEach(s => {
      const stabStr = Array.isArray(s.stabilityTests)
        ? s.stabilityTests.map(p => `${p.name}(${p.unit || ''}): 0M=${p.orig || '-'} | 6M=${p.m6 || '-'} | 12M=${p.m12 || '-'} | 18M=${p.m18 || '-'} | 24M=${p.m24 || '-'}`).join(' ; ')
        : '';
      rows.push([s.sampleId, s.product, s.customer, s.retentionCategory, s.mc, s.shift, s.timeRange || '', s.sapLot || s.coaRef || '', s.productionDate, s.quantity, s.unit, s.withdrawnQty, s.remainingQty, s.disposalDueDate, s.holdRef, s.status, s.storageLocation, s.conditionCheckDate || '', s.conditionResult || '', stabStr]);
    });
    const blob = new Blob(['\uFEFF' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `LPM1013_RetainSamples_${nowISO()}.csv`; a.click();
    URL.revokeObjectURL(url);
    toast('Export CSV เรียบร้อย');
  };
  function setupLiveFirestoreListeners() {
    state.unsubscribe.forEach(u => u());
    state.unsubscribe = [];
    state.unsubscribe.push(db.collection('retain_samples_f01').orderBy('productionDate', 'desc').limit(500).onSnapshot(s => { state.f01 = s.docs.map(d => enrichF01Sample({ id: d.id, ...d.data() })); render(); }));
    state.unsubscribe.push(db.collection('retain_withdrawals_f02').orderBy('withdrawalDate', 'desc').limit(500).onSnapshot(s => { state.f02 = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }));
    state.unsubscribe.push(db.collection('retain_monitoring_f03').orderBy('recordDateTime', 'desc').limit(300).onSnapshot(s => { state.f03 = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }));
    state.unsubscribe.push(db.collection('retain_disposals_f04').limit(300).onSnapshot(s => { state.f04 = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }));
    // ปิดการดึง retain_audit_events อัตโนมัติเพื่อประหยัด Read (ดึงเฉพาะตอนกดปุ่ม Export ตามช่วงวันที่)
    functions.httpsCallable('triggerRetainDailyCheck')().catch(() => {});
  }

document.getElementById('loginForm').onsubmit = async e => {
  e.preventDefault();
  loading(true, 'กำลังเข้าสู่ระบบ...');
  try {
    await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value.trim(), document.getElementById('loginPassword').value);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    loading(false);
  }
};

auth.onAuthStateChanged(async user => {
  if (!user) {
    state.unsubscribe.forEach(u => u()); state.unsubscribe = []; state.user = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    return;
  }
  state.user = user;
  const userRef = db.collection('users').doc(user.uid);
  const snap = await userRef.get().catch(() => null);
  const userData = snap && snap.exists ? snap.data() : { email: user.email, displayName: user.email };
  state.profile = userData;

  // แยกสิทธิ์ Retain Role (`retainRole`) ออกจาก `role` ของระบบ Internal Audit
  state.retainRole = resolveUserRetainRole(user.email, userData);

  // บันทึกฟิลด์ `retainRole` แยกไว้ในเอกสาร users/{uid} อัตโนมัติ (โดยไม่แตะต้องฟิลด์ `role` เดิมของ Internal Audit)
  if (!userData.retainRole) {
    userRef.set({ retainRole: state.retainRole }, { merge: true }).catch(() => {});
  }

  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userName').textContent = userData.displayName || user.email;
  document.getElementById('userRole').textContent = state.retainRole;

  if (RETAIN_ROLES[state.retainRole]?.canManageRoles) {
    document.getElementById('manageRoleBtn').classList.remove('hidden');
  } else {
    document.getElementById('manageRoleBtn').classList.add('hidden');
  }

  setupLiveFirestoreListeners();
  buildNav();
  render();
  updateNetwork();
});

document.getElementById('logoutBtn').onclick = () => auth.signOut();
document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');
document.getElementById('closeSidebarBtn').onclick = () => document.getElementById('sidebar').classList.remove('open');
</script>
