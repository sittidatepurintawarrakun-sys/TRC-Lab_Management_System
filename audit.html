<head>

  <style>
    *{box-sizing:border-box} body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#0f172a}
    .hidden{display:none!important}.nav-active{background:#2563eb;color:#fff}.card{background:white;border:1px solid #e2e8f0;border-radius:1rem}
    .spinner{width:18px;height:18px;border:2px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

    .status-NOT_EVALUATED{background:#f1f5f9;color:#475569}.status-CONFORMING{background:#dcfce7;color:#166534}.status-NC,.status-Major_NC,.status-Minor_NC{background:#fee2e2;color:#991b1b}.status-OBSERVATION{background:#fef3c7;color:#92400e}.status-NA{background:#e0e7ff;color:#3730a3}

<body class="min-h-screen">
<div id="toastArea" class="fixed z-[150] right-4 bottom-4 space-y-2"></div>

<section id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 p-5">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">

<div id="app" class="hidden min-h-screen">
  <aside id="sidebar" class="w-72 bg-slate-950 text-slate-300 min-h-screen fixed left-0 top-0 flex flex-col z-[60]">

    <nav class="p-4 space-y-2 flex-1 overflow-y-auto" id="nav"></nav>

      <div class="flex items-center gap-2"><span id="onlineBadge" class="text-xs px-3 py-1 rounded-full bg-green-100 text-green-700">Online</span><button onclick="window.print()" class="no-print border rounded-lg px-3 py-2 text-sm hover:bg-slate-50"><i class="fa-solid fa-print"></i></button></div>

<div id="modal" class="hidden fixed inset-0 z-[80] modal-backdrop p-4 overflow-y-auto"><div id="modalBody" class="max-w-5xl mx-auto my-6 bg-white rounded-2xl shadow-2xl"></div></div>
<input id="fileInput" type="file" accept="image/*,.pdf" class="hidden">

<script>
'use strict';
const firebaseConfig={
  apiKey:"AIzaSyCYalG5sMWG9jy4Lg-475TH_xuIRwA146w",
  authDomain:"lab-trc-management-system.firebaseapp.com",
  projectId:"lab-trc-management-system",
  storageBucket:"lab-trc-management-system.appspot.com",
  messagingSenderId:"43919979160",
  appId:"1:43919979160:web:779cb9de75cd4b9fce56ed"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore(), functions=firebase.app().functions('asia-southeast1'), storage=firebase.storage();
  try {
    db.settings({ experimentalForceLongPolling: true, merge: true });
    // เปิดใช้งาน Local Cache: ช่วยให้การ Refresh หน้าจอไม่ต้องดึงข้อมูลจาก Server ใหม่ (ลด Read ฟรีๆ)
    db.enablePersistence({ synchronizeTabs: true }).catch(err => {
      console.warn("Firebase Cache Error:", err.code);
    });
  } catch(e) {}
const SV=firebase.firestore.FieldValue;
const STANDARDS=['ISO9001','ISO14001','ISO45001','ISO50001','GMP','HACCP','Halal','FSC','PEFC','Customer Requirements'];
const DEPARTMENTS=['Top Management','Production','Quality Assurance','Quality Control Laboratory','Warehouse','Maintenance','Engineering','HR','Purchasing','Sales & Customer Service','Environment','Safety'];
const NAV=[['dashboard','Dashboard','fa-chart-line'],['program','Annual Programme','fa-calendar-check'],['planner','Audit Planning & AI','fa-wand-magic-sparkles'],['execution','Audit Execution','fa-clipboard-check'],['findings','Findings Review','fa-triangle-exclamation'],['capa','CAPA Tracking','fa-list-check'],['mrm','MRM Dashboard','fa-chart-pie'],['admin','Master Data & Users','fa-users-gear']];

// 🟢 State รวมที่ใช้จัดการตัวแปรทั้งหมดในระบบ
const state = {
  user: null, profile: null, view: 'dashboard', audits: [], findings: [], selectedAudit: null, generated: [], unsubscribe: [], 
  globalFilter: { year: 'All', department: 'All', status: 'All' }, 
  systemicInsights: null,
  pages: { program: 1, execution: 1, findings: 1, capa: 1 }
};

// Helpers การแบ่งหน้า
function paginateArray(array, pageSize, pageNumber) {
  return array.slice((pageNumber - 1) * pageSize, pageNumber * pageSize);
}

function renderPaginationBar(totalItems, pageSize, currentPage, viewName) {
  const totalPages = Math.ceil(totalItems / pageSize);
  if (totalPages <= 1) return ''; 
  return `
    <div class="flex justify-between items-center mt-4 bg-white p-3 rounded-xl border shadow-sm">
      <span class="text-sm font-medium text-slate-500">Showing ${(currentPage-1)*pageSize + 1} to ${Math.min(currentPage*pageSize, totalItems)} of ${totalItems} entries</span>
      <div class="flex gap-1">
        <button onclick="state.pages.${viewName} = ${Math.max(1, currentPage-1)}; render()" class="px-4 py-1.5 border rounded-lg hover:bg-slate-50 disabled:opacity-50 text-sm font-semibold transition" ${currentPage===1?'disabled':''}>Prev</button>
        <span class="px-4 py-1.5 font-bold text-blue-700 bg-blue-50 rounded-lg text-sm">${currentPage} / ${totalPages}</span>
        <button onclick="state.pages.${viewName} = ${Math.min(totalPages, currentPage+1)}; render()" class="px-4 py-1.5 border rounded-lg hover:bg-slate-50 disabled:opacity-50 text-sm font-semibold transition" ${currentPage===totalPages?'disabled':''}>Next</button>
      </div>
    </div>
  `;
}

const hasRole=(...r)=>state.profile&&r.includes(state.profile.role);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmtDate=v=>{if(!v)return'-';const d=v.toDate?v.toDate():new Date(v);return isNaN(d)?'-':d.toLocaleDateString('th-TH')};
const nowISO=()=>new Date().toISOString().slice(0,10);

function getFindingDisplayRef(finding) { if (finding.findingNo) return finding.findingNo; const idx = Number(finding.checkpointIndex); if (finding.auditId && Number.isInteger(idx) && idx >= 0) return `${finding.auditId}-CHK-${String(idx + 1).padStart(3, '0')}`; return finding.auditId ? `${finding.auditId}-FINDING` : 'Pending'; }
function getFindingDisplayTitle(finding) { return (finding.title || finding.question || finding.clause || 'Audit finding'); }
function toast(msg,type='ok'){const c=type==='error'?'bg-red-600':type==='warn'?'bg-amber-500':'bg-slate-900';const e=document.createElement('div');e.className=`toast ${c} text-white px-4 py-3 rounded-xl shadow-xl max-w-sm z-[150] relative`;e.textContent=msg;document.getElementById('toastArea').appendChild(e);setTimeout(()=>e.remove(),4500)}
function loading(on,msg='Processing...'){let e=document.getElementById('globalLoading');if(on){if(!e){e=document.createElement('div');e.id='globalLoading';e.className='fixed inset-0 z-[120] bg-slate-950/40 flex items-center justify-center';e.innerHTML=`<div class="bg-white rounded-xl p-5 shadow-xl flex gap-3 items-center"><div class="spinner"></div><span id="loadingText" class="font-semibold text-slate-700"></span></div>`;document.body.appendChild(e)}e.querySelector('#loadingText').textContent=msg}else e?.remove()}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modalBody').innerHTML=''}
function showModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('online',updateNetwork);window.addEventListener('offline',updateNetwork);function updateNetwork(){const b=document.getElementById('onlineBadge');b.textContent=navigator.onLine?'Online':'Offline';b.className=`text-xs px-3 py-1 rounded-full font-semibold ${navigator.onLine?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}`}

async function auditEvent(action,entityType,entityId,details={}){try{await db.collection('audit_events').add({action,entityType,entityId,details,userId:state.user.uid,userEmail:state.user.email,createdAt:SV.serverTimestamp()})}catch(e){console.warn('Audit event',e)}}
async function loadProfile(user){const ref=db.collection('users').doc(user.uid);const s=await ref.get();if(s.exists)return s.data();const p={email:user.email,displayName:user.displayName||user.email,role:'Auditor',active:true,createdAt:SV.serverTimestamp()};await ref.set(p,{merge:true});return p}

  function setupLiveData() {
    // 1. เคลียร์ Listener เก่าทิ้งทุกครั้งที่มีการเปลี่ยนเงื่อนไข (ประหยัดหน่วยความจำ)
    state.unsubscribe.forEach(f => f());
    state.unsubscribe = [];

    const fYear = state.globalFilter.year;

    // 2. ตั้งค่า Query พื้นฐาน ให้ดึงจากล่าสุดลงไปเก่าสุด
    let auditQuery = db.collection('audit_campaigns').orderBy('createdAt', 'desc');
    let findingQuery = db.collection('findings').orderBy('createdAt', 'desc');

    // 3. ถ้ามีการเลือก "ปี" จาก Filter ให้เพิ่มเงื่อนไขเข้าไป
    if (fYear !== 'All') {
      findingQuery = db.collection('findings').where('auditYear', '==', fYear).orderBy('createdAt', 'desc');
      auditQuery = db.collection('audit_campaigns').where('auditId', '>=', `AUD-${fYear}`).where('auditId', '<=', `AUD-${fYear}\uf8ff`).orderBy('createdAt', 'desc');
    }

    // 4. ดึงข้อมูล Audit และ Finding แบบจำกัดจำนวน 50 รายการ (Lazy Loading ประหยัด Read)
    state.unsubscribe.push(auditQuery.limit(50).onSnapshot(s => {
      state.audits = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }));

    state.unsubscribe.push(findingQuery.limit(50).onSnapshot(s => {
      state.findings = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }));

    // 5. [เพิ่มใหม่] ดึงข้อมูลสถิติตัวเลขสรุปยอด สำหรับแสดงกราฟใน Dashboard
    state.unsubscribe.push(db.collection('System_Stats').doc('Audit_Dashboard_Summary').onSnapshot(s => {
      state.dashboardStats = s.exists ? s.data() : null;
      if (state.view === 'dashboard') render();
    }));

    // 6. [ของเดิมที่ห้ามหาย] ดึงข้อมูล AI Insights เพื่อนำข้อความวิเคราะห์มาแสดงใน Dashboard
    state.unsubscribe.push(db.collection('System_Stats').doc('Global_Systemic_Insights').onSnapshot(s => {
      state.systemicInsights = s.exists ? s.data() : null;
      if (state.view === 'dashboard') render();
    }));
  }

auth.onAuthStateChanged(async user=>{if(!user){state.user=null;document.getElementById('app').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');return}try{state.user=user;state.profile=await loadProfile(user);if(state.profile.active===false)throw new Error('Account disabled');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userName').textContent=state.profile.displayName||user.email;document.getElementById('userRole').textContent=state.profile.role||'Auditor';buildNav();setupLiveData();render()}catch(e){toast(e.message,'error');await auth.signOut()}});
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loading(true,'Authenticating...');try{await auth.signInWithEmailAndPassword(loginEmail.value,loginPassword.value)}catch(err){toast(err.message,'error')}finally{loading(false)}});
document.getElementById('logoutBtn').onclick=()=>auth.signOut();document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');

  function buildNav() {
    nav.innerHTML = NAV.filter(n => n[0] !== 'admin' || hasRole('Admin')).map(n => `<button data-view="${n[0]}" class="nav-btn w-full text-left p-3 rounded-xl flex items-center gap-3 hover:bg-slate-800 transition ${state.view === n[0] ? 'nav-active' : ''}"><i class="fa-solid ${n[2]} w-5"></i>${n[1]}</button>`).join('');
    nav.querySelectorAll('button').forEach(b => b.onclick = () => {
      state.view = b.dataset.view;
      state.selectedAudit = null;
      state.globalFilter.status = 'All'; // ป้องกันสถานะ Filter ค้างตอนสลับเมนู
      buildNav();
      render();
      sidebar.classList.remove('open');
    });
  }
function render(){if(!state.user)return;const info=NAV.find(n=>n[0]===state.view)||NAV[0];pageTitle.textContent=info[1];content.innerHTML=({dashboard:renderDashboard,program:renderProgram,planner:renderPlanner,execution:renderExecution,findings:renderFindings,capa:renderCAPA,mrm:renderMRM,admin:renderAdmin}[state.view]||renderDashboard)()}

// Reusable Filter Bar
  function renderGlobalFilterBar() {
    let statusOptions = '';
    // เลือกรายการสถานะให้เหมาะสมกับหน้าที่กำลังเปิดอยู่
    if (state.view === 'findings' || state.view === 'capa') {
      statusOptions = ['DRAFT','ISSUED','CAPA_SUBMITTED','VERIFICATION','CLOSED'];
    } else if (state.view === 'program' || state.view === 'execution') {
      statusOptions = ['PLANNED','READY','IN_PROGRESS','COMPLETED','LOCKED'];
    }

    return `
      <div class="flex flex-wrap gap-3 mb-5 bg-white p-3 rounded-xl border shadow-sm items-center border-l-4 border-l-blue-500">
        <span class="text-sm font-bold text-slate-700 ml-2"><i class="fa-solid fa-filter text-blue-500 mr-2"></i>Filters:</span>
        <select class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium bg-slate-50 outline-none focus:border-blue-500 transition" onchange="state.globalFilter.year=this.value; state.pages['${state.view}'] = 1; render()">
          <option value="All">All Years</option>
          ${[...new Set(state.audits.map(a => a.auditId?.substring(4,8)||''))].filter(Boolean).sort().reverse().map(y => `<option value="${y}" ${state.globalFilter.year===y?'selected':''}>${y}</option>`).join('')}
        </select>
        <select class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium bg-slate-50 outline-none focus:border-blue-500 transition" onchange="state.globalFilter.department=this.value; state.pages['${state.view}'] = 1; render()">
          <option value="All">All Departments</option>
          ${DEPARTMENTS.map(d => `<option value="${d}" ${state.globalFilter.department===d?'selected':''}>${d}</option>`).join('')}
        </select>
        ${statusOptions ? `
        <select class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium bg-slate-50 outline-none focus:border-blue-500 transition" onchange="state.globalFilter.status=this.value; state.pages['${state.view}'] = 1; render()">
          <option value="All">All Statuses</option>
          ${statusOptions.map(s => `<option value="${s}" ${state.globalFilter.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        ` : ''}
      </div>
    `;
  }

// =========================================================================
// หน้า Dashboard
// =========================================================================
function renderDashboard() {
  const fYear = state.globalFilter.year;
  const fDept = state.globalFilter.department;

  const filteredAudits = state.audits.filter(a => {
    const matchYear = fYear === 'All' || (a.auditId && a.auditId.includes(fYear));
    const matchDept = fDept === 'All' || (a.meta?.targetDepartment === fDept);
    return matchYear && matchDept;
  });

  const filteredFindings = state.findings.filter(f => {
    const matchYear = fYear === 'All' || (f.auditYear === fYear) || (f.findingNo && f.findingNo.includes(fYear));
    const matchDept = fDept === 'All' || f.department === fDept;
    return matchYear && matchDept;
  });

  const completedAudits = filteredAudits.filter(a => a.meta?.status === 'COMPLETED').length;
  const auditPercent = filteredAudits.length ? Math.round((completedAudits / filteredAudits.length) * 100) : 0;

  const openFindingsList = filteredFindings.filter(f => !['CLOSED','VOID'].includes(f.status));
  const minorCount = openFindingsList.filter(f => f.classification === 'Minor NC').length;
  const majorCount = openFindingsList.filter(f => f.classification === 'Major NC').length;
  const totalOpenFindings = minorCount + majorCount;

  const overCapaCount = openFindingsList.filter(f => f.targetDate && f.targetDate < nowISO()).length;
  const dueSoonCount = openFindingsList.filter(f => f.targetDate && f.targetDate >= nowISO() && f.targetDate <= new Date(Date.now() + 7*86400000).toISOString().slice(0,10)).length;

  let totalCheckpoints = 0;
  let conformingCount = 0;
  let observationCount = 0;
  let minorNCCountTotal = 0;
  let majorNCCountTotal = 0;
  let standardScores = {}; 

  filteredAudits.forEach(audit => {
    if (audit.checklist && audit.checklist.length > 0) {
      audit.checklist.forEach(chk => {
        if (chk.result === 'NA' || chk.result === 'NOT_EVALUATED') return;
        totalCheckpoints++;
        if (chk.result === 'CONFORMING') conformingCount++;
        else if (chk.result === 'OBSERVATION') observationCount++;
        else if (chk.result === 'Minor NC') minorNCCountTotal++;
        else if (chk.result === 'Major NC') majorNCCountTotal++;

        let std = chk.standardsCovered || 'General';
        if (!standardScores[std]) standardScores[std] = { total: 0, pass: 0 };
        standardScores[std].total++;
        if (chk.result === 'CONFORMING' || chk.result === 'OBSERVATION') standardScores[std].pass++;
      });
    }
  });

  const complianceScore = totalCheckpoints > 0 ? Math.round(((conformingCount + observationCount) / totalCheckpoints) * 100) : 0;
  const chartData = { conform: conformingCount, obs: observationCount, minor: minorNCCountTotal, major: majorNCCountTotal, total: totalCheckpoints };

  // คำนวณ % สำหรับแสดงในรายการด้านล่างกราฟ
  const pctConform = totalCheckpoints > 0 ? Math.round((conformingCount / totalCheckpoints) * 100) : 0;
  const pctObs = totalCheckpoints > 0 ? Math.round((observationCount / totalCheckpoints) * 100) : 0;
  const pctMinor = totalCheckpoints > 0 ? Math.round((minorNCCountTotal / totalCheckpoints) * 100) : 0;
  const pctMajor = totalCheckpoints > 0 ? Math.round((majorNCCountTotal / totalCheckpoints) * 100) : 0;

  const deptRiskScores = {};
  filteredFindings.forEach(f => {
    if (f.status === 'VOID') return;
    const dept = f.department || 'Unknown';
    if (!deptRiskScores[dept]) deptRiskScores[dept] = 0;
    if (f.classification === 'Major NC') deptRiskScores[dept] += 10;
    else if (f.classification === 'Minor NC') deptRiskScores[dept] += 5;
    else if (f.classification === 'OBSERVATION') deptRiskScores[dept] += 1;
  });
  const topRisks = Object.entries(deptRiskScores).sort((a, b) => b[1] - a[1]).slice(0, 5);

  setTimeout(() => initNewDashboardCharts(chartData), 100);

  // 🟢 HTML สำหรับ Systemic AI Insights
  let aiInsightsHtml = `<div class="py-12 text-center text-slate-400 font-medium"><i class="fa-regular fa-lightbulb text-4xl mb-3 text-slate-200 block"></i>ยังไม่มีข้อมูลการวิเคราะห์เชิงระบบ<br>กดปุ่มด้านบนเพื่อให้ AI เริ่มประมวลผล</div>`;

  let dashDonutChart = null;
  const centerTextPlugin = {
    id: 'centerText',
    beforeDraw: function(chart) {
      if (chart.config.type !== 'doughnut') return;
      const ctx = chart.ctx;
      const meta = chart.getDatasetMeta(0);
      if (!meta.data || !meta.data.length) return;

      // หาจุดกึ่งกลางของวงกลมโดนัทแบบเป๊ะๆ (ไม่ต้องกะระยะด้วยตา)
      const centerX = meta.data[0].x;
      const centerY = meta.data[0].y;
      const total = chart.config.data.datasets[0].data.reduce((a, b) => a + b, 0);

      ctx.restore();

      // วาดตัวเลขตรงกลาง (ปรับขนาดให้เล็กลงเป็น 3.5rem)
      ctx.font = "900 3.5rem Sarabun";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#1e293b"; 
      const text = total.toString();
      const textX = centerX - (ctx.measureText(text).width / 2);
      const textY = centerY - 12;
      ctx.fillText(text, textX, textY);

      // วาดข้อความ TOTAL FINDINGS
      ctx.font = "bold 0.7rem Sarabun";
      ctx.fillStyle = "#64748b"; 
      const text2 = "TOTAL FINDINGS";
      const text2X = centerX - (ctx.measureText(text2).width / 2);
      const text2Y = centerY + 22;
      ctx.fillText(text2, text2X, text2Y);
      ctx.save();
    }
  };

  function initNewDashboardCharts(data) {
    const donutCtx = document.getElementById('resultsDonutChart');
    if (!donutCtx) return;
    if (dashDonutChart) dashDonutChart.destroy();

    dashDonutChart = new Chart(donutCtx, {
      type: 'doughnut',
      data: {
        // เอา % ออกจาก Legend เพื่อกันข้อความยาวล้นจอ
        labels: ['Conformity', 'Observation', 'Minor NC', 'Major NC'],
        datasets: [{ 
          data: [data.conform, data.obs, data.minor, data.major], 
          backgroundColor: ['#10b981', '#fbbf24', '#f97316', '#ef4444'], 
          borderWidth: 3, 
          borderColor: '#ffffff', 
          hoverOffset: 6 
        }]
      },
      plugins: [centerTextPlugin],
      options: {
        responsive: true, 
        maintainAspectRatio: false, 
        cutout: '75%',
        plugins: { 
          legend: { 
            display: true, 
            position: 'right', 
            labels: { 
              usePointStyle: true, 
              pointStyle: 'circle', 
              font: { family: 'Sarabun', size: 12, weight: 'bold' }, 
              padding: 12, 
              color: '#475569' 
            } 
          }, 
          tooltip: { titleFont: { family: 'Sarabun' }, bodyFont: { family: 'Sarabun' } } 
        }
      }
    });
  }

function renderProgram(){
  return `<div class="flex justify-between items-center mb-4"><div><h3 class="font-bold text-lg text-slate-800">Annual Audit Programme</h3><p class="text-sm text-slate-500 font-medium">Risk-based schedule and assignment</p></div><button onclick="openProgramForm()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg shadow-sm font-bold transition"><i class="fa-solid fa-plus mr-2"></i>New Audit</button></div>${renderGlobalFilterBar()}${auditTable(state.audits)}`;
}

  function auditTable(data){
    const fYear = state.globalFilter.year;
    const fDept = state.globalFilter.department;
    const fStatus = state.globalFilter.status;

    const filteredData = data.filter(a => {
      const matchYear = fYear === 'All' || (a.auditId && a.auditId.includes(fYear));
      const matchDept = fDept === 'All' || (a.meta?.targetDepartment === fDept);

      // ดึงสถานะปัจจุบันของ Audit มาเช็ค (ถ้าไม่มีให้มองเป็น PLANNED)
      const currentStatus = a.meta?.status || a.status || 'PLANNED';
      const matchStatus = fStatus === 'All' || (currentStatus === fStatus);

      return matchYear && matchDept && matchStatus;
    });

    const ITEMS_PER_PAGE = 15;
    const currentView = state.view === 'execution' ? 'execution' : 'program';
    const paginatedData = paginateArray(filteredData, ITEMS_PER_PAGE, state.pages[currentView]);
    const tableHtml = `<div class="card overflow-x-auto shadow-sm border-slate-200"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-4 text-left font-bold text-slate-600">Audit</th><th class="p-4 text-left font-bold text-slate-600">Department</th><th class="p-4 text-center font-bold text-slate-600">Date</th><th class="p-4 text-center font-bold text-slate-600">Status</th><th class="p-4 text-center font-bold text-slate-600">Progress</th><th class="p-4"></th></tr></thead><tbody>
    ${paginatedData.map(a=>{
      const q=a.checklist||[],done=q.filter(x=>x.result&&x.result!=='NOT_EVALUATED').length,p=q.length?Math.round(done/q.length*100):0;
      const deleteBtn = hasRole('Admin') ? `<button onclick="deleteAudit('${a.id}')" class="text-red-500 hover:text-red-700 ml-4 bg-red-50 p-2 rounded-lg" title="ลบข้อมูล"><i class="fa-solid fa-trash"></i></button>` : '';
      return `<tr class="border-t hover:bg-slate-50 transition"><td class="p-4"><b>${esc(a.meta?.title||a.title||a.id)}</b><div class="text-xs text-slate-400 font-semibold mt-1">${esc(a.auditId||a.id)}</div></td><td class="p-4 font-semibold text-slate-700">${esc(a.meta?.targetDepartment||a.department)}</td><td class="p-4 text-center font-medium">${esc(a.meta?.scheduledDate||a.scheduledDate||'-')}</td><td class="p-4 text-center"><span class="bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 text-[11px] font-bold tracking-wide">${esc(a.meta?.status||a.status||'PLANNED')}</span></td><td class="p-4 text-center font-bold text-slate-700">${p}%</td><td class="p-4 text-right whitespace-nowrap"><button onclick="openAudit('${a.id}')" class="text-blue-600 hover:text-blue-800 font-bold bg-blue-50 px-4 py-1.5 rounded-lg transition">Open</button> ${deleteBtn}</td></tr>`
    }).join('')||'<tr><td class="p-12 text-center text-slate-400 font-medium" colspan="6"><i class="fa-regular fa-folder-open text-3xl mb-2 text-slate-200 block"></i>No audits found matching criteria</td></tr>'}</tbody></table></div>`;
    return tableHtml + renderPaginationBar(filteredData.length, ITEMS_PER_PAGE, state.pages[currentView], currentView);
  }

  document.querySelectorAll('.gen-clause').forEach(e => { const i = Number(e.dataset.index); if (state.generated[i]) state.generated[i].clause = e.value; });
  document.querySelectorAll('.gen-question').forEach(e => { const i = Number(e.dataset.index); if (state.generated[i]) state.generated[i].question = e.value; });
  document.querySelectorAll('.gen-evidence').forEach(e => { const i = Number(e.dataset.index); if (state.generated[i]) state.generated[i].expectedEvidence = e.value; });
  document.querySelectorAll('.gen-risk').forEach(e => { const i = Number(e.dataset.index); if (state.generated[i]) state.generated[i].riskFocus = e.value; });
  document.querySelectorAll('.gen-type').forEach(e => { const i = Number(e.dataset.index); if (state.generated[i]) state.generated[i].questionType = e.value; });

async function saveGeneratedChecklist() {
  syncGeneratedChecklistEditors();
  const auditId = document.getElementById('planAudit')?.value || state.audits[0]?.id;
  if (!auditId) { toast('กรุณาเลือก Audit Campaign', 'warn'); return; }
  if (!state.generated.length) { toast('ไม่มี Checklist สำหรับบันทึก', 'warn'); return; }

  const incompleteIndex = state.generated.findIndex(item => (!String(item.clause || '').trim() || !String(item.question || '').trim() || !String(item.expectedEvidence || '').trim()));
  if (incompleteIndex >= 0) { toast(`Checklist ลำดับที่ ${incompleteIndex + 1} ยังระบุ Clause, Question หรือ Expected Evidence ไม่ครบ`, 'warn'); return; }

  const department = document.getElementById('planDept')?.value || '';
  const selectedStandards = [...document.querySelectorAll('[name=std]:checked')].map(element => element.value);
  loading(true, 'Saving approved checklist...');

  try {
    const fn = functions.httpsCallable('saveAuditPlan');
    await fn({ auditId, department, standards: selectedStandards, questions: state.generated });
    state.generated = []; toast('Checklist approved and saved'); state.view = 'execution'; buildNav(); render();
  } catch (error) { toast(error.message, 'error'); } finally { loading(false); }
}

async function openFindingDraft(auditId, checkpointIndex, checkpoint) {
  const audit = state.audits.find(item => item.id === auditId); if (!audit) throw new Error('Audit campaign not found.');
  const auditReference = audit.auditId || audit.id; const checklistItemId = checkpoint.itemId || `CHK-${String(checkpointIndex + 1).padStart(3, '0')}`;
  const findingNo = `${auditReference}-${checklistItemId}`, findingDocumentId = findingNo.replace(/[\/\\#?]/g, '_'), findingReference = db.collection('findings').doc(findingDocumentId);
  const existingSnapshot = await findingReference.get(), existingData = existingSnapshot.exists ? existingSnapshot.data() : {};
  if (existingSnapshot.exists && existingData.status === 'VOID') return;
  const scheduledDate = audit.meta?.scheduledDate || audit.scheduledDate || '', auditYear = scheduledDate ? scheduledDate.slice(0, 4) : String(new Date().getFullYear());
  const findingData = { auditId: auditReference, auditDocumentId: audit.id, checkpointIndex, checklistItemId, findingNo, title: checkpoint.question || checkpoint.clause || 'Audit finding', department: audit.meta?.targetDepartment || audit.department || 'Not specified', clause: checkpoint.clause || '', standardsCovered: checkpoint.standardsCovered || '', criteria: checkpoint.expectedEvidence || checkpoint.requirement || '', condition: checkpoint.evidence || '', objectiveEvidence: checkpoint.evidence || '', classification: checkpoint.result?.includes('NC') ? checkpoint.result : 'Observation', status: existingData.status || 'DRAFT', auditYear, createdBy: existingData.createdBy || state.user.email, createdAt: existingData.createdAt || SV.serverTimestamp(), updatedBy: state.user.email, updatedAt: SV.serverTimestamp() };
  await findingReference.set(findingData, { merge: true });
  await auditEvent(existingSnapshot.exists ? 'UPDATE' : 'CREATE', 'FINDING', findingDocumentId, { auditId: auditReference, findingNo, checkpointIndex, checklistItemId });
}

function renderFindings(data = state.findings) {
  const fYear = state.globalFilter.year, fDept = state.globalFilter.department, fStatus = state.globalFilter.status;
  const filteredData = data.filter(f => {
    const matchYear = fYear === 'All' || (f.auditYear === fYear) || (f.findingNo && f.findingNo.includes(fYear));
    const matchDept = fDept === 'All' || f.department === fDept;
    const matchStatus = fStatus === 'All' || f.status === fStatus;
    return matchYear && matchDept && matchStatus;
  });

  const ITEMS_PER_PAGE = 15;
  const currentView = state.view === 'capa' ? 'capa' : 'findings';
  const paginatedData = paginateArray(filteredData, ITEMS_PER_PAGE, state.pages[currentView]);

  const rows = paginatedData.map(finding => {
    const deleteButton = hasRole('Admin') ? `<button type="button" onclick="deleteFinding('${finding.id}')" class="text-red-500 hover:text-red-700 ml-4 bg-red-50 p-2 rounded-lg transition" title="ลบ Finding"><i class="fa-solid fa-trash"></i></button>` : '';
    let classificationClass = 'text-blue-600 bg-blue-50';
    if (finding.classification === 'Major NC') classificationClass = 'text-red-600 bg-red-50 border border-red-100 shadow-sm';
    else if (finding.classification === 'Minor NC') classificationClass = 'text-amber-600 bg-amber-50 border border-amber-100 shadow-sm';

    return `<tr class="border-t hover:bg-slate-50 transition"><td class="p-4 max-w-md"><div class="flex flex-col gap-1.5"><b class="text-blue-700 text-[15px]">${esc(getFindingDisplayRef(finding))}</b><span class="text-xs font-bold text-slate-700 line-clamp-2 leading-relaxed" title="${esc(getFindingDisplayTitle(finding))}">${esc(getFindingDisplayTitle(finding))}</span><span class="text-xs text-slate-500 line-clamp-2 mt-1"><b class="text-slate-600">Obj. Evidence:</b> ${esc(finding.condition || finding.objectiveEvidence || '-')}</span></div></td><td class="p-4 align-top"><span class="font-bold text-slate-700 block mb-1">${esc(finding.department || '-')}</span><span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-1 rounded inline-block">${esc(finding.clause || '-')}</span></td><td class="p-4 text-center align-top"><span class="${classificationClass} px-3 py-1.5 rounded-lg text-xs font-bold tracking-wide">${esc(finding.classification || 'Unclassified')}</span></td><td class="p-4 text-center align-top"><span class="bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 text-xs font-bold tracking-wide text-slate-600">${esc(finding.status || 'DRAFT')}</span></td><td class="p-4 text-center align-top font-semibold text-slate-700">${esc(finding.targetDate || '-')}</td><td class="p-4 text-right whitespace-nowrap align-top"><button type="button" onclick="editFinding('${finding.id}')" class="text-blue-600 hover:text-blue-800 font-bold bg-blue-50 px-4 py-2 rounded-lg transition">Review</button>${deleteButton}</td></tr>`;
  }).join('') || `<tr><td colspan="6" class="p-12 text-center text-slate-400 font-medium"><i class="fa-solid fa-check-double text-4xl mb-3 text-slate-200 block"></i>No findings found matching criteria</td></tr>`;

  const filterHtml = state.view === 'findings' ? renderGlobalFilterBar() : '';
  const tableHtml = `${filterHtml}<div class="card overflow-x-auto shadow-sm border-slate-200"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-4 text-left font-bold text-slate-600">Finding Ref.</th><th class="p-4 text-left font-bold text-slate-600">Department / Clause</th><th class="p-4 text-center font-bold text-slate-600">Classification</th><th class="p-4 text-center font-bold text-slate-600">Status</th><th class="p-4 text-center font-bold text-slate-600">Due</th><th class="p-4"></th></tr></thead><tbody>${rows}</tbody></table></div>`;

  return tableHtml + renderPaginationBar(filteredData.length, ITEMS_PER_PAGE, state.pages[currentView], currentView);
}

async function analyzeFindingWithAI(id) {

  loading(true, '🤖 AI กำลังวิเคราะห์รากเหง้าของปัญหาและสร้าง CAPA...');
  try {
    const fn = functions.httpsCallable('analyzeFindingAndCAPA'); const response = await fn({ findingId: id, department: f.department || 'Unknown', clause: f.clause || 'Unknown', condition: condition, criteria: criteria }); const aiResult = response.data.analysis;
    if (aiResult.proposedRootCause) document.getElementById('finding-rootCause').value = aiResult.proposedRootCause; if (aiResult.correction) document.getElementById('finding-correction').value = aiResult.correction; if (aiResult.correctiveAction) document.getElementById('finding-correctiveAction').value = aiResult.correctiveAction; if (aiResult.effectivenessCriteria) document.getElementById('finding-effectivenessCriteria').value = aiResult.effectivenessCriteria;

  } catch (x) { console.error(x); toast('การวิเคราะห์ด้วย AI ล้มเหลว: ' + x.message, 'error'); } finally { loading(false); }
}

}

function renderMRM(){const byDept={},byClass={};state.findings.forEach(f=>{byDept[f.department||'Unknown']=(byDept[f.department||'Unknown']||0)+1;byClass[f.classification||'Unclassified']=(byClass[f.classification||'Unclassified']||0)+1});const bar=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="mb-3"><div class="flex justify-between text-sm"><span>${esc(k)}</span><b>${v}</b></div><div class="h-2 bg-slate-100 rounded"><div class="h-2 bg-blue-600 rounded" style="width:${Math.min(100,v/Math.max(...Object.values(o),1)*100)}%"></div></div></div>`).join('');return `<div class="grid lg:grid-cols-2 gap-6"><section class="card p-5"><h3 class="font-bold mb-4">Findings by Department</h3>${bar(byDept)||'<p class="text-slate-400">No data</p>'}</section><section class="card p-5"><h3 class="font-bold mb-4">Findings by Classification</h3>${bar(byClass)||'<p class="text-slate-400">No data</p>'}</section><section class="card p-5 lg:col-span-2"><h3 class="font-bold mb-3">Management Review Inputs</h3><ul class="list-disc pl-5 text-sm space-y-2"><li>Audit programme completion: ${state.audits.filter(a=>a.meta?.status==='COMPLETED').length} completed of ${state.audits.length} recorded.</li><li>Open findings: ${state.findings.filter(f=>f.status!=='CLOSED').length}</li><li>Repeat and systemic issues require confirmation through approved classification and effectiveness review.</li></ul></section></div>`}
function renderAdmin(){if(!hasRole('Admin'))return '<div class="card p-8">Access denied.</div>';return `<div class="card p-5"><h3 class="font-bold text-lg">Administration</h3><p class="text-sm text-slate-500 mt-1">Create users in Firebase Authentication, then maintain their role document under users/{uid}.</p><div class="mt-4 bg-slate-50 rounded-xl p-4 text-sm"><b>Supported roles</b><div class="mt-2 flex gap-2 flex-wrap">${['Admin','Lead Auditor','Auditor','Auditee','Management Viewer'].map(x=>`<span class="bg-white border rounded-full px-3 py-1">${x}</span>`).join('')}</div></div></div>`}

// การจับฟังก์ชันลง window object (เพื่อให้ HTML เรียกใช้งานได้)
window.closeModal=closeModal; window.openProgramForm=openProgramForm; window.openAudit=openAudit; window.saveGeneratedChecklist=saveGeneratedChecklist; window.saveCheckpoint=saveCheckpoint; window.attachEvidence=attachEvidence; window.finalizeAudit=finalizeAudit; window.editFinding=editFinding; window.state=state; window.deleteExecutionItem=deleteExecutionItem; window.reopenAudit=reopenAudit;

updateNetwork();

async function deleteAudit(id) {if (!confirm('ยืนยันการลบ Audit Campaign นี้? ข้อมูลจะถูกลบทิ้งอย่างถาวร')) return; loading(true, 'กำลังลบข้อมูล Audit...'); try { await db.collection('audit_campaigns').doc(id).delete(); await auditEvent('DELETE', 'AUDIT', id); toast('ลบเรียบร้อย', 'ok'); } catch (error) { toast(error.message, 'error'); } finally { loading(false); }}
async function deleteFinding(id) {if (!confirm('ยืนยันการลบ Finding นี้? ข้อมูลจะหายไปอย่างถาวร')) return; loading(true, 'กำลังลบข้อมูล Finding...'); try { await db.collection('findings').doc(id).delete(); await auditEvent('DELETE', 'FINDING', id); toast('ลบเรียบร้อย', 'ok'); } catch (error) { toast(error.message, 'error'); } finally { loading(false); }}

// 🟢 ฟังก์ชันสำหรับปุ่ม Analyze Now (ดึงข้อมูลเข้าสู่ window)
async function triggerSystemicAnalysis() {
  if(!confirm("ระบบจะส่งข้อมูล Finding ทั้งหมดที่ยังไม่ปิดให้ AI ประเมินปัญหาเชิงระบบ (Systemic Issues) ยืนยันการทำงานหรือไม่?")) return;
  loading(true, '🤖 AI กำลังวิเคราะห์จุดอ่อนข้ามแผนกระดับองค์กร...');
  try {
    const fn = functions.httpsCallable('generateSystemicInsights');
    const result = await fn();
    toast(`วิเคราะห์สำเร็จ! AI ประมวลผลจากข้อมูล ${result.data.count} รายการ`, 'ok');
  } catch (error) {
    toast(`ไม่สามารถวิเคราะห์ข้อมูลได้: ${error.message}`, 'error');
  } finally {
    loading(false);
  }
}
window.triggerSystemicAnalysis = triggerSystemicAnalysis;

</script>
